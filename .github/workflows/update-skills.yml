name: Update agent skills

on:
  schedule:
    - cron: '29 4 * * 6' # Saturdays 04:29 UTC (05:29 CET / 06:29 CEST)
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Installs the skills CLI at the version package-lock.json pins.
      - name: Install dependencies
        run: npm ci

      # The skills in skills-lock.json, from their upstream repositories.
      # OpenSpec's own skills are updated by update-openspec.yml.
      - name: Update skills
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: npx --no-install skills update --project --yes

      # .agents/references/ holds addyosmani/agent-skills references/,
      # unedited, for its skills; the skills CLI doesn't update them.
      - name: Update references
        id: references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/addyosmani/agent-skills/commits/main --jq .sha)
          # The commit comes from another repository: accept only a full SHA
          # before it reaches URLs, outputs or the PR.
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected commit SHA for addyosmani/agent-skills"
            exit 1
          fi
          for file in .agents/references/*.md; do
            curl --fail --silent --show-error --location --retry 3 \
              --output "$file" \
              "https://raw.githubusercontent.com/addyosmani/agent-skills/$sha/references/${file##*/}"
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: detect
        run: |
          git add --all .agents .claude skills-lock.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All agent skills and references are up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --cached --stat
          fi

      - name: Open pull request
        id: pr
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          REFERENCES_SHA: ${{ steps.references.outputs.sha }}
        run: |
          branch="chore/update-skills-$(date -u +%Y%m%d)"
          # The checkout keeps no credential, so the installs above couldn't
          # use it; authenticate only the git calls that need it.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
          # A branch from an earlier run belongs to its pull request, which may
          # have commits added since: leave both as they are.
          if git "${git_auth[@]}" ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::$branch already exists, so it and its pull request are left as they are."
            exit 0
          elif [ $? -ne 2 ]; then
            echo "::error::Could not check whether $branch exists on origin"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -m "chore(skills): update agent skills and references"
          # Without --force: if the branch appeared since the check, fail.
          git "${git_auth[@]}" push origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "chore(skills): update agent skills and references" \
            --body "Automated update of the skills in \`skills-lock.json\` from their upstream repositories, and of \`.agents/references/\` from [addyosmani/agent-skills@${REFERENCES_SHA:0:12}](https://github.com/addyosmani/agent-skills/tree/${REFERENCES_SHA}/references).

          Review the skill diffs before merging: they change what agents do. The Verification checks workflow runs \`npm run docs:check\`, which fails on a reference an updated skill broke, or on a doc check exception the update made stale."
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger pull_request workflows, so start the verification checks explicitly.
      - name: Run verification checks
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: gh workflow run verification-checks.yml --ref "$BRANCH"
