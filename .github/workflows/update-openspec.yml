name: Update OpenSpec

on:
  schedule:
    - cron: '17 3 * * 6' # Saturdays 03:17 UTC (04:17 CET / 05:17 CEST)
  workflow_dispatch:

# Each job gets only what it needs: the update runs third-party code with a
# read-only token, and the job that pushes runs none of it.
permissions: {}

concurrency:
  group: update-openspec
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      version: ${{ steps.detect.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Detect new OpenSpec release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo Fission-AI/OpenSpec --json tagName --jq .tagName)
          latest="${latest#v}"
          # The tag name comes from another repository: accept only a plain
          # x.y.z version before it reaches logs, outputs, branch names or PRs.
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected OpenSpec release tag, expected x.y.z"
            exit 1
          fi
          current=$(node -p "require('./package.json').devDependencies?.['@fission-ai/openspec'] ?? require('./package.json').dependencies['@fission-ai/openspec']")
          current="${current#^}"
          echo "latest=$latest current=$current"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          highest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          if [ "$latest" != "$current" ] && [ "$highest" = "$latest" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "OpenSpec $current is the latest release." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update @fission-ai/openspec
        if: steps.detect.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.latest }}
        run: |
          npm pkg set "devDependencies.@fission-ai/openspec=^${VERSION}"
          npm install

      - name: Update OpenSpec skills
        if: steps.detect.outputs.changed == 'true'
        run: npx openspec update

      - name: Package the update
        id: package
        if: steps.detect.outputs.changed == 'true'
        run: |
          git add --all
          git diff --cached --binary > "$RUNNER_TEMP/update.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-patch
          path: ${{ runner.temp }}/update.patch
          if-no-files-found: error
          retention-days: 1

  open-pr:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-patch
          path: ${{ runner.temp }}/update

      # The version was accepted only as x.y.z in the update job.
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: chore/update-openspec-${{ needs.update.outputs.version }}
          PATCH: ${{ runner.temp }}/update/update.patch
          TITLE: 'chore(deps): update OpenSpec to ${{ needs.update.outputs.version }}'
          BODY: |-
            Automated update for the [OpenSpec ${{ needs.update.outputs.version }} release](https://github.com/Fission-AI/OpenSpec/releases/tag/v${{ needs.update.outputs.version }}).

            - Bumps `@fission-ai/openspec` in `package.json`
            - Refreshes OpenSpec skills via `npx openspec update`

            Review the skill diffs and run the Definition of Done checks before merging.
          VERIFY: 'true'
        run: bash .github/scripts/open-update-pr.sh
