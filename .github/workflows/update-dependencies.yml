name: Update dependencies

on:
  schedule:
    - cron: '43 3 * * 0' # Sundays 03:43 UTC (04:43 CET / 05:43 CEST)
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update dependencies (skip major bumps)
        run: |
          npx --yes npm-check-updates --target minor -u
          npm install
          git diff --stat

      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All dependencies are up to date (excluding major bumps)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        id: pr
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          branch="chore/update-dependencies-$(date -u +%Y%m%d)"
          # The checkout keeps no credential, so the dependency installs above
          # couldn't use it; authenticate only the git calls that need it.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
          # A branch from an earlier run belongs to its pull request, which may
          # have commits added since: leave both as they are.
          if git "${git_auth[@]}" ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::$branch already exists, so it and its pull request are left as they are."
            exit 0
          elif [ $? -ne 2 ]; then
            echo "::error::Could not check whether $branch exists on origin"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package.json package-lock.json
          git commit -m "chore(deps): update dependencies"
          # Without --force: if the branch appeared since the check, fail.
          git "${git_auth[@]}" push origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "chore(deps): update dependencies" \
            --body "Automated dependency update (major version bumps are skipped). Typecheck, Lint, Build and Tests run in the Verification checks workflow."
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger pull_request workflows, so start the verification checks explicitly.
      - name: Run verification checks
        if: steps.pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: gh workflow run verification-checks.yml --ref "$BRANCH"
