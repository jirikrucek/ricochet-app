name: Update OpenSpec

on:
  schedule:
    - cron: '17 3 * * 6' # Saturdays 03:17 UTC (04:17 CET / 05:17 CEST)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-openspec
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Detect new OpenSpec release
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view --repo Fission-AI/OpenSpec --json tagName --jq .tagName)
          latest="${latest#v}"
          # The tag name comes from another repository: accept only a plain
          # x.y.z version before it reaches logs, outputs, branch names or PRs.
          if ! [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected OpenSpec release tag, expected x.y.z"
            exit 1
          fi
          current=$(node -p "require('./package.json').devDependencies?.['@fission-ai/openspec'] ?? require('./package.json').dependencies['@fission-ai/openspec']")
          current="${current#^}"
          echo "latest=$latest current=$current"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          highest=$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)
          if [ "$latest" != "$current" ] && [ "$highest" = "$latest" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update @fission-ai/openspec
        if: steps.detect.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.detect.outputs.latest }}
        run: |
          npm pkg set "devDependencies.@fission-ai/openspec=^${VERSION}"
          npm install

      - name: Update OpenSpec skills
        if: steps.detect.outputs.changed == 'true'
        run: npx openspec update

      - name: Open pull request
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.detect.outputs.latest }}
        run: |
          branch="chore/update-openspec-${VERSION}"
          # The checkout keeps no credential, so the dependency installs above
          # couldn't use it; authenticate only the git calls that need it.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git_auth=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth")
          # A branch from an earlier run belongs to its pull request, which may
          # have commits added since: leave both as they are.
          if git "${git_auth[@]}" ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "::notice::$branch already exists, so it and its pull request are left as they are."
            exit 0
          elif [ $? -ne 2 ]; then
            echo "::error::Could not check whether $branch exists on origin"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "chore(deps): update OpenSpec to ${VERSION}"
          # Without --force: if the branch appeared since the check, fail.
          git "${git_auth[@]}" push origin "$branch"
          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title "chore(deps): update OpenSpec to ${VERSION}" \
            --body "Automated update for the [OpenSpec ${VERSION} release](https://github.com/Fission-AI/OpenSpec/releases/tag/v${VERSION}).

          - Bumps \`@fission-ai/openspec\` in \`package.json\`
          - Refreshes OpenSpec skills via \`npx openspec update\`

          Review the skill diffs and run the Definition of Done checks before merging."
