name: Verification checks

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # PRs opened with GITHUB_TOKEN (e.g. update-dependencies.yml) don't trigger
  # pull_request runs, so those workflows dispatch this one on their branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, Lint, Build, Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # Every check runs even if an earlier one fails, so a PR shows all failures at once.

      # Runs first: the TanStack Router plugin generates the gitignored
      # src/routeTree.gen.ts that Typecheck needs.
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:unit

      - name: Integration tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:integration

      - name: Install Playwright browser
        id: playwright
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm run test:e2e:install
          npx playwright install-deps chromium

      - name: E2E tests
        if: ${{ !cancelled() && steps.playwright.outcome == 'success' }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ failure() && steps.playwright.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
