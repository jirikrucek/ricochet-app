name: Update dependencies

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update dependencies (skip major bumps)
        run: |
          npx --yes npm-check-updates --target minor -u
          npm install
          git diff --stat

      - name: Detect changes
        id: detect
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All dependencies are up to date (excluding major bumps)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request
        id: pr
        if: steps.detect.outputs.changed == 'true'
        run: |
          branch="chore/update-dependencies-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package.json package-lock.json
          git commit -m "chore(deps): update dependencies"
          git push --force origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "chore(deps): update dependencies" \
            --body "Automated dependency update (major version bumps are skipped). Typecheck, Lint, Build and Tests run in the Verification checks workflow." \
            || echo "PR already exists for $branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger pull_request workflows, so start the verification checks explicitly.
      - name: Run verification checks
        if: steps.detect.outputs.changed == 'true'
        run: gh workflow run verification-checks.yml --ref "${{ steps.pr.outputs.branch }}"
