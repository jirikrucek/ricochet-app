name: Update agent skills

on:
  schedule:
    - cron: '29 4 * * 6' # Saturdays 04:29 UTC (05:29 CET / 06:29 CEST)
  workflow_dispatch:

# Each job gets only what it needs: the update runs third-party code with a
# read-only token, and the job that pushes runs none of it.
permissions: {}

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.package.outputs.changed }}
      branch: ${{ steps.package.outputs.branch }}
      references-sha: ${{ steps.references.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Installs the skills CLI at the version package-lock.json pins.
      - name: Install dependencies
        run: npm ci

      # The skills in skills-lock.json, from their upstream repositories.
      # OpenSpec's own skills are updated by update-openspec.yml.
      - name: Update skills
        env:
          DISABLE_TELEMETRY: '1'
          DO_NOT_TRACK: '1'
        run: npx --no-install skills update --project --yes

      # .agents/references/ holds addyosmani/agent-skills references/,
      # unedited, for its skills; the skills CLI doesn't update them.
      - name: Update references
        id: references
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/addyosmani/agent-skills/commits/main --jq .sha)
          # The commit comes from another repository: accept only a full SHA
          # before it reaches URLs, outputs or the PR.
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected commit SHA for addyosmani/agent-skills"
            exit 1
          fi
          for file in .agents/references/*.md; do
            curl --fail --silent --show-error --location --retry 3 \
              --output "$file" \
              "https://raw.githubusercontent.com/addyosmani/agent-skills/$sha/references/${file##*/}"
          done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Package the update
        id: package
        run: |
          git add --all .agents .claude skills-lock.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All agent skills and references are up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            git diff --cached --stat
            git diff --cached --binary > "$RUNNER_TEMP/update.patch"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "branch=chore/update-skills-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.package.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-patch
          path: ${{ runner.temp }}/update.patch
          if-no-files-found: error
          retention-days: 1

  open-pr:
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: update-patch
          path: ${{ runner.temp }}/update

      # The references commit was accepted only as a full SHA in the update job.
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ needs.update.outputs.branch }}
          PATCH: ${{ runner.temp }}/update/update.patch
          TITLE: 'chore(skills): update agent skills and references'
          BODY: |-
            Automated update of the skills in `skills-lock.json` from their upstream repositories, and of `.agents/references/` from [addyosmani/agent-skills@${{ needs.update.outputs.references-sha }}](https://github.com/addyosmani/agent-skills/tree/${{ needs.update.outputs.references-sha }}/references).

            Review the skill diffs before merging: they change what agents do. The Verification checks workflow runs `npm run docs:check`, which fails on a reference an updated skill broke, or on a doc check exception the update made stale.
          VERIFY: 'true'
        run: bash .github/scripts/open-update-pr.sh
